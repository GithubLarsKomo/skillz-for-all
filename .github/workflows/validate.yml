name: Validate Skillz for All

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Diagnose changed hashes
        shell: bash
        continue-on-error: true
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          root=Path(".")
          sums=json.loads((root/"release/SHA256SUMS.json").read_text())
          changed=subprocess.check_output(["git","diff","--name-only","origin/main...HEAD"], text=True).splitlines()
          bad=[]
          for rel in changed:
              if rel not in sums: continue
              p=root/rel
              if not p.is_file(): bad.append(f"missing:{rel}"); continue
              actual=hashlib.sha256(p.read_bytes()).hexdigest()
              if actual != sums[rel]: bad.append(f"mismatch:{rel}")
          assert not bad, "\n".join(bad)
          PY

      - name: Diagnose unchanged framework hashes
        continue-on-error: true
        run: python -c 'import hashlib,json,pathlib,subprocess; s=json.load(open("release/SHA256SUMS.json")); ch=set(subprocess.check_output(["git","diff","--name-only","origin/main...HEAD"],text=True).splitlines()); b=[p for p,h in s.items() if p.startswith("framework/") and p not in ch and (not pathlib.Path(p).is_file() or hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()!=h)]; assert not b, b'
      - name: Diagnose unchanged non-framework hashes
        continue-on-error: true
        run: python -c 'import hashlib,json,pathlib,subprocess; s=json.load(open("release/SHA256SUMS.json")); ch=set(subprocess.check_output(["git","diff","--name-only","origin/main...HEAD"],text=True).splitlines()); b=[p for p,h in s.items() if not p.startswith("framework/") and p not in ch and (not pathlib.Path(p).is_file() or hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()!=h)]; assert not b, b'

      - name: Verify release hash targets
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path(".")
          sums=json.loads((root/"release/SHA256SUMS.json").read_text())
          bad=[]
          for rel, expected in sums.items():
              p=root/rel
              if not p.is_file(): bad.append(f"missing:{rel}"); continue
              actual=hashlib.sha256(p.read_bytes()).hexdigest()
              if actual != expected: bad.append(f"mismatch:{rel}")
          assert not bad, "\n".join(bad)
          PY

      - name: Verify skill dependency graph
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "tools")
          import validate_white_label_release as v
          errors=[]
          v.validate_skill_graph(Path("."), errors)
          assert not errors, "\n".join(errors)
          PY

      - name: Validate release contracts
        run: python tools/validate_white_label_release.py .

      - name: Verify portable skill set
        shell: bash
        run: |
          set -euo pipefail
          test "$(find framework/skills -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')" = "342"

      - name: Verify public privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'euroimmun|revvity|komorowski|ratzeburg-ai\.de' . \
              --exclude-dir=.git \
              --exclude='validate.yml'; then
            echo "Forbidden company/source-owner content found."
            exit 1
          fi

      - name: Verify empty starter federation
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("second-brain/super-second-brain/docs/super-memory/registry.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d.get("brains") == [], d
          PY

      - name: Verify Apache-2.0 licensing
        shell: bash
        run: |
          set -euo pipefail
          test -f LICENSE
          grep -q '^                                 Apache License$' LICENSE
          grep -q 'Version 2.0, January 2004' LICENSE
          grep -q 'mode: Apache-2.0' instance.yaml
          grep -q 'licenseFile: "LICENSE"' instance.yaml
          grep -q '"spdx": "Apache-2.0"' deployment-manifest.json
