name: Validate Skillz for All

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Diagnose release hash targets
        continue-on-error: true
        run: python -c 'import hashlib,json,pathlib; s=json.load(open("release/SHA256SUMS.json")); b=[p for p,h in s.items() if not pathlib.Path(p).is_file() or hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()!=h]; assert not b, b'

      - name: Verify skill dependency graph
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "tools")
          import validate_white_label_release as v
          errors=[]
          v.validate_skill_graph(Path("."), errors)
          assert not errors, "\n".join(errors)
          PY

      - name: Validate release contracts
        continue-on-error: true
        run: python tools/validate_white_label_release.py .
      - name: Probe required release files
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "tools")
          import validate_white_label_release as v
          missing=[p for p in v.REQUIRED if not Path(p).is_file()]
          assert not missing, missing
          PY
      - name: Probe release metadata
        run: |
          python - <<'PY'
          import json
          m=json.load(open("release/manifest.json"))
          d=json.load(open("deployment-manifest.json"))
          i=open("instance.yaml").read()
          checks=[
            ("manifest.storageProvider",m.get("storageProvider")=="google-drive"),
            ("manifest.rebindRequired",m.get("rebindRequired") is True),
            ("manifest.runtimeStoragePolicy",m.get("runtimeStoragePolicy")=="drive-only"),
            ("manifest.sourceExclusion",m.get("sourceExclusionPolicyApplied") is True),
            ("manifest.artifactDelivery",m.get("artifactDeliveryPolicy")=="drive-link-first"),
            ("deployment.provider",d.get("storage",{}).get("provider")=="google-drive"),
            ("deployment.runtimePolicy",d.get("storage",{}).get("runtimePolicy")=="drive-only"),
            ("deployment.generatedArtifacts",d.get("storage",{}).get("generatedNonCodeArtifacts")=="google-drive-required"),
            ("deployment.linkFirst",d.get("storage",{}).get("linkFirstDelivery") is True),
            ("deployment.noOwnerRuntime",d.get("runtimeDependencyOnSourceOwner") is False),
            ("privacy.noOwnerKnowledge",d.get("privacy",{}).get("containsSourceOwnerKnowledge") is False),
            ("privacy.noOrgContent",d.get("privacy",{}).get("containsOrganizationSpecificContent") is False),
            ("privacy.emptyRegistry",d.get("privacy",{}).get("starterRegistryMustBeEmpty") is True),
            ("instance.driveOnly","runtimeStoragePolicy: drive-only" in i),
            ("instance.provider","provider: google-drive" in i),
            ("instance.requireWrite","requireDriveWrite: true" in i),
            ("instance.returnLinks","returnStoredLinks: true" in i),
          ]
          bad=[n for n,ok in checks if not ok]
          assert not bad,bad
          PY
      - name: Probe starter registry
        run: python -c 'import json; assert json.load(open("second-brain/super-second-brain/docs/super-memory/registry.json")).get("brains")==[]'

      - name: Verify portable skill set
        shell: bash
        run: |
          set -euo pipefail
          count="$(find framework/skills -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          echo "portable_skill_count=$count"
          test "$count" -ge "342"

      - name: Verify public privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'euroimmun|revvity|komorowski|ratzeburg-ai\.de' . \
              --exclude-dir=.git \
              --exclude='validate.yml'; then
            echo "Forbidden company/source-owner content found."
            exit 1
          fi

      - name: Verify empty starter federation
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("second-brain/super-second-brain/docs/super-memory/registry.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d.get("brains") == [], d
          PY

      - name: Verify Apache-2.0 licensing
        shell: bash
        run: |
          set -euo pipefail
          test -f LICENSE
          grep -q '^                                 Apache License$' LICENSE
          grep -q 'Version 2.0, January 2004' LICENSE
          grep -q 'mode: Apache-2.0' instance.yaml
          grep -q 'licenseFile: "LICENSE"' instance.yaml
          grep -q '"spdx": "Apache-2.0"' deployment-manifest.json
