name: Validate Skillz for All

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Diagnose release hash targets
        continue-on-error: true
        run: python -c 'import hashlib,json,pathlib; s=json.load(open("release/SHA256SUMS.json")); b=[p for p,h in s.items() if not pathlib.Path(p).is_file() or hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()!=h]; assert not b, b'

      - name: Verify skill dependency graph
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "tools")
          import validate_white_label_release as v
          errors=[]
          v.validate_skill_graph(Path("."), errors)
          assert not errors, "\n".join(errors)
          PY

      - name: Validate release contracts
        continue-on-error: true
        run: python tools/validate_white_label_release.py .
      - name: Probe release contract fields
        run: python -c 'import json; m=json.load(open("release/manifest.json")); d=json.load(open("deployment-manifest.json")); i=open("instance.yaml").read(); assert m.get("storageProvider")=="google-drive"; assert m.get("rebindRequired") is True; assert m.get("runtimeStoragePolicy")=="drive-only"; assert m.get("sourceExclusionPolicyApplied") is True; assert m.get("artifactDeliveryPolicy")=="drive-link-first"; s=d.get("storage",{}); assert s.get("provider")=="google-drive"; assert s.get("runtimePolicy")=="drive-only"; assert s.get("generatedNonCodeArtifacts")=="google-drive-required"; assert s.get("linkFirstDelivery") is True; assert d.get("runtimeDependencyOnSourceOwner") is False; p=d.get("privacy",{}); assert p.get("containsSourceOwnerKnowledge") is False; assert p.get("containsOrganizationSpecificContent") is False; assert p.get("starterRegistryMustBeEmpty") is True; assert "runtimeStoragePolicy: drive-only" in i; assert "provider: google-drive" in i; assert "requireDriveWrite: true" in i; assert "returnStoredLinks: true" in i'

      - name: Verify portable skill set
        shell: bash
        run: |
          set -euo pipefail
          test "$(find framework/skills -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')" = "342"

      - name: Verify public privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'euroimmun|revvity|komorowski|ratzeburg-ai\.de' . \
              --exclude-dir=.git \
              --exclude='validate.yml'; then
            echo "Forbidden company/source-owner content found."
            exit 1
          fi

      - name: Verify empty starter federation
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("second-brain/super-second-brain/docs/super-memory/registry.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d.get("brains") == [], d
          PY

      - name: Verify Apache-2.0 licensing
        shell: bash
        run: |
          set -euo pipefail
          test -f LICENSE
          grep -q '^                                 Apache License$' LICENSE
          grep -q 'Version 2.0, January 2004' LICENSE
          grep -q 'mode: Apache-2.0' instance.yaml
          grep -q 'licenseFile: "LICENSE"' instance.yaml
          grep -q '"spdx": "Apache-2.0"' deployment-manifest.json
